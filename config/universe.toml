# =============================================================================
# Alpha AI – Handelsuniversen
# =============================================================================
# Definiert die auswählbaren Märkte/Universen. Die Symbole stehen
# ausschließlich hier (nicht im Code), sodass Universen ohne Programmier-
# kenntnisse angepasst werden können.
#
# Feld "complete":
#   true  = vollständige Indexzusammensetzung.
#   false = kuratierte Startliste (Seed), die in einem späteren Sprint über
#           eine Konstituenten-Quelle vervollständigt wird. Bewusst ehrlich
#           gekennzeichnet, damit keine unvollständige Liste als vollständig
#           missverstanden wird.
#
# "suffix" ist das an Yahoo-Symbole anzuhängende Börsenkürzel (z. B. ".DE").
# =============================================================================

# ------------------------------- Deutschland ---------------------------------
[universes.dax]
name = "DAX"
region = "DE"
suffix = ".DE"
